<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            display: flex;
            border: 2px solid black;
            width: 1100px;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin: 5px;
        }

        .image img {
            width: 208px;
        }

        .text h1,
        .text p {
            margin: 4px 0;
        }

        .image {
            position: relative;
        }

        .capsule {
            position: absolute;
            bottom: 4px;
            z-index: 10;
            right: 5px;
            background: #242020;
            opacity: 0.9;
            color: white;
            padding: 3px;

            border-radius: 3px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- card exercise -->
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="https://i.ytimg.com/vi/pHI4PBFM0wY/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLBuEnK2bo1ArtMXaAy-zN3N6-SV9w"
                    alt="">
                <div class="capsule">
                    31:22
                </div>
            </div>
            <div class="text">
                <h1>CSS Animations | Sigma Web Development Course - Tutorial #46</h1>
                <p>ayush g . 657k views . 2 months ago</p>

            </div>
        </div>
    </div>
</body>

</html>
