<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify - Web Player: Music for everyone</title>
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/utility.css" />
  </head>

  <body>
    <div class="container flex">
      <!-- <img src="logo.svg" alt=""> -->
      <div class="left bg-black">
        <img src="img/close.svg" class="close-icon" alt="Close" />

        <div class="home bg-grey rounded m-1 p-1">
          <div class="logo">
            <img width="40" class="invert" src="img/logo.svg" alt="spotify" />
            <span> Spotify </span>
          </div>
          <ul>
            <li>
              <img class="invert" src="img/home.svg" alt="Home" />
              <span> Home </span>
            </li>
            <li>
              <img class="invert" src="img/search.svg" alt="Search" />
              <span> Search </span>
            </li>
          </ul>
        </div>
        <div class="library bg-grey rounded m-1 p-1">
          <div class="heading">
            <img class="invert" src="img/list.svg" alt="List Icon" width="30" />

            <h2>Your library</h2>
          </div>
          <div class="info">
            <img class="icon" src="img/music.svg" alt="Music Icon" />

            <div class="text">
              <div>Song Name</div>
              <div>Song Artist</div>
            </div>
            <div class="close">
              <div class="playnow">Play Now</div>
              <img class="playbuttonc" src="img/playsong.svg" alt="Play" />



            </div>
          </div>

          <div class="songList">
            <ul>
              <li></li>
            </ul>
          </div>
          <div class="footer">
            <a href="https://www.spotify.com/in-en/legal/">Legal</a>
            <a href="https://www.spotify.com/in-en/safetyandprivacy/"
              >Safety & Privacy Center</a
            >
            <a href="https://www.spotify.com/in-en/legal/privacy-policy/"
              >Privacy Policy</a
            >
            <a href="https://www.spotify.com/in-en/legal/cookies-policy/"
              >Cookies</a
            >
            <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3"
              >About Ads</a
            >
            <a href="https://www.spotify.com/in-en/accessibility/"
              >Accessibility</a
            >
            <a
              href="https://www.spotify.com/legal/cookies-policy/"
              target="_blank"
              rel="noopener"
              >Cookies</a
            >
          </div>
        </div>
      </div>
      <div class="right bg-grey rounded">
        <div class="header">
          <div class="nav">
            <!-- Inside .nav -->
            <button id="hamburger">
              <img src="img/hamburger.svg"  alt="menu" width="26" />
            </button>

            <img class="arrow-icon" src="img/left.svg" alt="Left" />
            <img class="arrow-icon" src="img/right.svg" alt="Right" />
          </div>

          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>
        <div class="spotifyPlaylists">
          <h1>Trending songs</h1>
          <div class="cardContainer">
            <!-- <div data-folder="ncs" class="card">
              <img
                class="play"
                src="playbutton.svg"
                alt="Play Button"
                width="64"
                height="64"
              />

              <img
                src="https://i.scdn.co/image/ab67616d00001e02127b091422dfbcc367062145"
                alt=""
              />
              <h2>Qayde Se (From "Metro ... In Dino")</h2>
              <p>Amitabh battacharuya , pritham , Arman</p>
            </div> -->
            
        </div>
        <div class="playbar">
          <audio src="songs/1.mp3" id="main-audio" autoplay></audio>

          <div class="seekbar">
            <div class="circle"></div>
          </div>
          <div class="abovebar">
            <div class="songinfo small-white-text"></div>

            <div class="songbuttons">
              <img id="last" src="img/previoussong.svg" alt="" />
              <img id="play" src="img/playsong.svg" alt="" />
              <img id="next" src="img/nextsong.svg" alt="" />
            </div>
            <div class="songtime"></div>
            <div class="volume">
              <img src="img/volume.svg" alt="" />
              <div class="range">
                <input type="range" class="funk" name="volume" id="rang" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
